name: CI/CD & KZDI Talent OS Automation Pipeline

on:
  push:
    branches:
      - showcase/kzdi-talent-os
      - main
  pull_request:
    branches:
      - showcase/kzdi-talent-os

permissions:
  contents: read

concurrency:
  group: kzdi-talent-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Repository: https://github.com/Kzknowledge/kzdi-agents-league

env:
  NODE_VERSION: '24.21.0'

jobs:
  code-quality-and-security:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: TypeScript type check
        run: npm run typecheck --if-present

  operational-testing-and-dry-run:
    name: Operational Testing & Dry Run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: code-quality-and-security
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test --if-present -- --coverage
        env:
          CI: true

      - name: Build Next.js app (dry run)
        run: npm run build --if-present
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Verify build output
        run: |
          if [ -d ".next" ]; then
            echo "✅ Build successful"
            ls -la .next/ | head -20
          else
            echo "Build output not found"
            exit 1
          fi

  deploy-to-netlify:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [code-quality-and-security, operational-testing-and-dry-run]
    if: github.ref == 'refs/heads/showcase/kzdi-talent-os' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build --if-present
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy to Netlify
        id: netlify-deploy
        run: |
          npm install --no-save netlify-cli@27.8.0
          DEPLOY_OUTPUT=$(npx --no-install netlify deploy --prod --dir=.next --message="KZDI Talent OS Showcase - Build #${{ github.run_number }}" 2>&1)
          echo "$DEPLOY_OUTPUT"
          NETLIFY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP '(?<=Live URL:).*' | head -1 | xargs)
          echo "netlify_url=$NETLIFY_URL" >> $GITHUB_OUTPUT
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Extract deployment info
        id: deployment-info
        run: |
          echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "commit_sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "actor=${{ github.actor }}" >> $GITHUB_OUTPUT

      - name: Stream deployment status to KZ Mentor Bot
        run: |
          TELEGRAM_MESSAGE="
          ✅ KZDI Talent OS CI/CD Passed
          
          Repository: github.com/Kzknowledge/kzdi-agents-league
          Branch: ${{ steps.deployment-info.outputs.branch }}
          Commit: ${{ steps.deployment-info.outputs.commit_sha_short }}
          
          🚀 Netlify URL: ${{ steps.netlify-deploy.outputs.netlify_url }}
          
          Status: Deployed
          Pipeline Duration: ${{ job.duration }}
          
          Pushed by: ${{ steps.deployment-info.outputs.actor }}
          "
          
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -H 'Content-Type: application/json' \
            -d '{
              "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
              "text": "'"${TELEGRAM_MESSAGE}"'",
              "parse_mode": "HTML"
            }' || echo "⚠️ Telegram notification skipped"


  cleanup-on-failure:
    name: Cleanup on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: failure() && github.event_name == 'push'
    needs: [code-quality-and-security, operational-testing-and-dry-run, deploy-to-netlify]
    steps:
      - name: Alert failure to KZ Mentor Bot
        run: |
          TELEGRAM_MESSAGE="
          ❌ KZDI Talent OS CI/CD Failed
          
          Repository: github.com/Kzknowledge/kzdi-agents-league
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          
          Pipeline Job: ${{ github.job }}
          Run ID: ${{ github.run_id }}
          
          Check: https://github.com/Kzknowledge/kzdi-agents-league/actions/runs/${{ github.run_id }}
          "
          
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -H 'Content-Type: application/json' \
            -d '{
              "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
              "text": "'"${TELEGRAM_MESSAGE}"'",
              "parse_mode": "HTML"
            }' || true
