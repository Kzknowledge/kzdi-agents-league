name: CI/CD & Talent OS Automation Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  repository_dispatch:
    types: [new_registration]

permissions:
  contents: read

concurrency:
  group: kzdi-core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Code Quality & Security
    steps:
      - name: Checkout repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Initialize Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - name: Install core project dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run dependency security audit
        run: npm audit --audit-level=moderate

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Perform repository-wide credential-pattern scan
        shell: bash
        run: |
          set -euo pipefail

          # Scan tracked text files while excluding dependency/build metadata.
          # This is a lightweight guard; GitHub secret scanning remains authoritative.
          if git grep -nI -E             -e 'sk-[A-Za-z0-9_-]{20,}'             -e 'AIza[0-9A-Za-z_-]{30,}'             -e 'gh[pousr]_[A-Za-z0-9_]{20,}'             -e 'github_pat_[A-Za-z0-9_]{20,}'             -- . ':!package-lock.json'; then
            echo "❌ Potential exposed credential pattern found in tracked files."
            exit 1
          fi

          echo "✅ Repository credential-pattern scan passed."

  test_and_dry_run:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Operational Testing & Dry Run
    steps:
      - name: Checkout repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - name: Install project dependencies for headless runner
        run: npm ci

      - name: Execute System Verification Script
        env:
          DRY_RUN: "true"
          AI_PROVIDER: "gemini"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: npm start

  notify_status:
    if: github.event_name == 'push' && always()
    needs: [quality, test_and_dry_run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Stream Status to KZ Mentor
    steps:
      - name: Dispatch Production Success Telemetry
        if: ${{ needs.quality.result == 'success' && needs.test_and_dry_run.result == 'success' }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}" \
            -d "text=✅ **KZDI Talent OS CI/CD Passed**%0A%0ARepository: Kzknowledge/kzdi-agents-league%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}&parse_mode=Markdown"

      - name: Dispatch Infrastructure Failure Alert
        if: ${{ needs.quality.result == 'failure' || needs.test_and_dry_run.result == 'failure' }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}" \
            -d "text=❌ **KZDI Talent OS CI/CD Pipeline FAILED**%0A%0ACheck real-time logs at: https://github.com/Kzknowledge/kzdi-agents-league/actions/runs/${{ github.run_id }}&parse_mode=Markdown"
